<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>calccad</title>
<style>
  :root {
    --bar-bg: #f3f3f3;
    --bar-border: #d0d0d0;
    --menu-bg: #ffffff;
    --menu-hover: #dbe6f6;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --page: #ffffff;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
  }
  html, body { margin: 0; height: 100%; background: var(--bar-bg); color: var(--text);
               font: 13px "DejaVu Sans", Tahoma, Verdana, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #menubar { display: flex; flex: none; padding: 0 4px; border-bottom: 1px solid var(--bar-border); user-select: none; }
  #menubar > .top { position: relative; }
  #menubar > .top > button { font: inherit; background: none; border: 0; padding: 4px 8px; color: inherit; }
  #menubar > .top > button:hover, #menubar > .top.open > button { background: var(--menu-hover); }
  .menu { display: none; position: absolute; left: 0; top: 100%; z-index: 20; min-width: 260px; padding: 3px 0;
          background: var(--menu-bg); border: 1px solid var(--bar-border); box-shadow: var(--shadow); }
  .top.open > .menu { display: block; }
  .menu .item { display: flex; gap: 24px; padding: 4px 12px 4px 26px; white-space: nowrap; position: relative; }
  .menu .item:hover { background: var(--menu-hover); }
  .menu .item.off { color: var(--muted); }
  .menu .item.off:hover { background: none; }
  .menu .item .key { margin-left: auto; color: var(--muted); }
  .menu .item.checked::before { content: "\2713"; position: absolute; left: 9px; }
  .menu .item.sub::after { content: "\25B8"; margin-left: auto; }
  .menu .item.sub > .menu { left: 100%; top: -4px; }
  .menu .item.sub:hover > .menu, .menu .item.sub.open > .menu { display: block; }
  @media (pointer: coarse) {
    /* fingers: larger targets */
    #menubar > .top > button { padding: 8px 12px; }
    .menu .item { padding: 9px 14px 9px 30px; }
    #tools button, #tools select { padding: 6px 12px; }
  }
  .menu hr { border: 0; border-top: 1px solid var(--bar-border); margin: 3px 0; }
  #tools { display: flex; gap: 6px; align-items: center; padding: 4px 8px; flex: none;
           border-bottom: 1px solid var(--bar-border); }
  #tools button, #tools select { font: inherit; padding: 2px 8px; }
  #zoom { min-width: 3.5em; text-align: center; }
  #view { position: relative; flex: 1; min-height: 0; background: var(--page); }
  #sheet { position: absolute; left: 0; top: 0; display: block; }
  #scroller { position: absolute; inset: 0; overflow: auto; outline: none; user-select: none;
              cursor: default; touch-action: none; -webkit-user-select: none;
              -webkit-touch-callout: none; overscroll-behavior: contain; }
  #spacer { width: 1px; height: 1px; }
  /* the keyboard's: typed text, input methods; out of sight */
  #keys { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
          resize: none; overflow: hidden; pointer-events: none;
          font-size: 16px; /* iOS zooms the page into a field of a smaller font */ }
  #status { display: flex; border-top: 1px solid var(--bar-border); flex: none; }
  #status span { padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint { flex: 1; }
  #note { min-width: 12em; border-left: 1px solid var(--bar-border); }
  #mode { min-width: 5em; border-left: 1px solid var(--bar-border); }
  .hidden { display: none !important; }
  dialog { border: 1px solid var(--bar-border); box-shadow: var(--shadow); padding: 16px 18px; max-width: min(720px, 92vw);
           font: inherit; color: var(--text); }
  dialog h2 { font-size: 15px; margin: 0 0 12px; }
  dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  dialog button, dialog input, dialog select { font: inherit; padding: 3px 10px; }
  dialog .list { max-height: 50vh; overflow: auto; border: 1px solid var(--bar-border); margin-top: 8px; }
  dialog .list div { padding: 3px 8px; cursor: pointer; white-space: pre; }
  dialog .list div:hover, dialog .list div.sel { background: var(--menu-hover); }
  dialog pre { white-space: pre-wrap; max-height: 60vh; overflow: auto; tab-size: 18; margin: 0; }
  dialog table { border-collapse: collapse; width: 100%; }
  dialog td { padding: 3px 6px; border-bottom: 1px solid var(--bar-border); }
  #print { display: none; }
  @media print {
    @page { size: A4; margin: 0; }
    html, body { background: #fff; height: auto; }
    #app, dialog { display: none !important; }
    #print { display: block; }
    #print img { display: block; width: 210mm; height: 297mm; page-break-after: always; break-after: page; }
  }
</style>
</head>
<body>
<div id="app">
  <nav id="menubar" aria-label="Meny"></nav>
  <div id="tools">
    <select id="sheets" aria-label="Exempelblad"></select>
    <button id="zoomout" title="Zooma ut (Ctrl+Minus)">&minus;</button>
    <span id="zoom">100 %</span>
    <button id="zoomin" title="Zooma in (Ctrl+Plus)">+</button>
    <button id="zoom100" title="100 % (Ctrl+0)">100 %</button>
  </div>
  <div id="view">
    <canvas id="sheet"></canvas>
    <div id="scroller"><div id="spacer"></div></div>
    <textarea id="keys" aria-label="calccad" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  </div>
  <div id="status"><span id="hint">Laddar…</span><span id="note"></span><span id="mode">AUTO</span></div>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="pick" class="hidden">
<div id="print"></div>
<script>
  /* Which build: the threaded one (computing in the background) when the
     page is cross-origin isolated, else the one computing on the page's
     thread. Not isolated by the server: once, a service worker (sw.js)
     isolates it and the page loads again; ?st=1 asks for the build
     without threads, ?nosw=1 for no service worker. */
  (function () {
    var q = new URLSearchParams(location.search), mt = self.crossOriginIsolated && !q.has('st'), s;
    if (!self.crossOriginIsolated && !q.has('st') && !q.has('nosw') && 'serviceWorker' in navigator &&
        window.isSecureContext && !sessionStorage.getItem('calccad-sw')) {
      sessionStorage.setItem('calccad-sw', '1');
      /* loaded again once the worker is active (Firefox and Safari activate
         it after register resolves: a load before that is not isolated) */
      navigator.serviceWorker.register('sw.js').then(function () {
        return navigator.serviceWorker.ready;
      }).then(function () { location.reload(); }, function () { location.reload(); });
      return;
    }
    window.calccadThreads = mt;
    s = document.createElement('script');
    s.src = mt ? 'calccad-mt.js' : 'calccad.js';
    s.onload = function () {
      var a = document.createElement('script');
      a.src = 'app.js';
      document.body.appendChild(a);
    };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
